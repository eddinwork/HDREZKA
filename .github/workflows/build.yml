name: build

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Core + tests
        run: dotnet build tests/HDREZKA.Tests/HDREZKA.Tests.csproj -c Release

      - name: Test
        run: dotnet test tests/HDREZKA.Tests/HDREZKA.Tests.csproj -c Release --no-build

      - name: Build WinUI app
        run: dotnet build src/HDREZKA.App/HDREZKA.App.csproj -c Release -p:Platform=x64

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDREZKA-app-x64
          path: src/HDREZKA.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: warn
